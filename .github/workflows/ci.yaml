name: ci

on:
  push:
    branches: ['main']
    tags: ['v*']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # The WebPKI labs answer the ACME HTTP-01 challenge on port 80,
      # which the runner's unprivileged user cannot bind.
      - run: sudo sysctl -w net.ipv4.ip_unprivileged_port_start=0
      # The stranded-tier lab outpaces the shared runner; the package's
      # other labs still run.
      - run: go test -race -count=2 -skip '^TestStrandedTierHeals$' ./...

  build:
    needs: [lint, test]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: ko-build/setup-ko@v0.10
      - run: >
          ko build --bare --platform linux/amd64
          --tags ${{ github.ref_name }}
          github.com/fancl20/cion/cmd/cion
