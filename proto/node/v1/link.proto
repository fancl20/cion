syntax = "proto3";

package node.v1;

option go_package = "github.com/fancl20/cion/proto/node/v1;nodev1";

// LinkRequest asks the peer to admit a direct link between the two nodes,
// riding the control endpoint's authenticated channel: the requester is
// named by its verified certificate chain, never by a claim. It tells the
// acceptor how the requester sees it on the link, and whether the
// acceptor's rendezvous port answered there.
message LinkRequest {
  // local_addr is the requester's link local underlay address, "host:port".
  string local_addr = 1;
  // if_id is the requester's interface ID of the link.
  uint32 if_id = 2;
  // observed is the source the requester's end of the link last observed
  // the acceptor at, else the address it sends the acceptor to,
  // "host:port": the acceptor as the requester sees it.
  string observed = 3;
  // rendezvous_answered reports whether the acceptor's rendezvous port
  // answered the requester's binding request at the observed host.
  bool rendezvous_answered = 4;
}

// LinkReply carries the acceptor's side of the link — the address and
// interface ID the requester sends to — and tells the requester how the
// acceptor sees it on the link, and whether the requester's rendezvous port
// answered there.
message LinkReply {
  // local_addr is the acceptor's link local underlay address, "host:port".
  string local_addr = 1;
  // if_id is the acceptor's interface ID of the link.
  uint32 if_id = 2;
  // observed is the source the acceptor's end of the link last observed
  // the requester at, else the address it sends the requester to,
  // "host:port": the requester as the acceptor sees it.
  string observed = 3;
  // rendezvous_answered reports whether the requester's rendezvous port
  // answered the acceptor's binding request at the observed host.
  bool rendezvous_answered = 4;
}

// PunchRequest asks the peer to open its NAT toward the requester for the
// link the requester establishes: the peer binds the link's socket, learns
// its reflexive address, sends toward the requester's, and answers with its
// own. The requester then sends toward the peer's, and the packets cross
// both NATs.
message PunchRequest {
  // reflexive_addr is the requester's link socket as a node outside its
  // NAT observes it, "host:port".
  string reflexive_addr = 1;
  // nonce marks the punch's packets, 16 bytes.
  bytes nonce = 2;
  // if_id is the requester's interface ID of the link.
  uint32 if_id = 3;
  // directory is the 16-byte directory ID whose peers the punch reaches
  // across: each side learns its reflexive address from a reflector in it.
  bytes directory = 4;
}

// PunchReply carries the peer's side of the link's punch.
message PunchReply {
  // reflexive_addr is the peer's link socket as a node outside its NAT
  // observes it, "host:port".
  string reflexive_addr = 1;
  // if_id is the peer's interface ID of the link.
  uint32 if_id = 2;
}

// PunchProbeRequest asks the peer to answer a probe through both NATs: the
// peer binds an ephemeral socket, learns its reflexive address, and answers
// with it, then the socket sends toward the requester's and echoes the
// requester's probes for as long as the stream stays open.
message PunchProbeRequest {
  // reflexive_addr is the requester's probe socket as a node outside its
  // NAT observes it, "host:port".
  string reflexive_addr = 1;
  // nonce marks the probe's packets, 16 bytes.
  bytes nonce = 2;
  // directory is the 16-byte directory ID whose peers the probe reaches
  // across: each side learns its reflexive address from a reflector in it.
  bytes directory = 3;
}

// PunchProbeReply carries the peer's probe socket.
message PunchProbeReply {
  // reflexive_addr is the peer's probe socket as a node outside its NAT
  // observes it, "host:port".
  string reflexive_addr = 1;
}

// LinkService establishes links bilaterally between nodes that composed
// paths already reach. The acceptor applies its admission policy — the
// allowlist, the link-count cap, and the rate cap — records the link on its
// side, and answers with its own addresses. Each end tells the other the
// host it sees the other at on the link and whether the other's rendezvous
// port answered there. A punch opens both sides' NATs first, for a link
// neither side's published address admits.
service LinkService {
  // Request admits the caller's link and answers the acceptor's side of it.
  rpc Request(LinkRequest) returns (LinkReply);
  // Punch opens the acceptor's NAT toward the caller for the link the
  // caller establishes, and answers the acceptor's side.
  rpc Punch(PunchRequest) returns (PunchReply);
  // PunchProbe opens the acceptor's NAT toward the caller's probe socket
  // and answers with the acceptor's own, which echoes the caller's probes
  // while the stream stays open.
  rpc PunchProbe(PunchProbeRequest) returns (stream PunchProbeReply);
}
