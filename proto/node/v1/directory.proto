syntax = "proto3";

package node.v1;

option go_package = "github.com/fancl20/cion/proto/node/v1;nodev1";

// Entry is one node's publication: everything the selection loop needs to
// probe the node as a candidate neighbor.
message Entry {
  // isd_as is the publisher's ISD-AS. The directory records the ISD-AS the
  // authenticated publisher's certificate names, never the claimed one.
  uint64 isd_as = 1;
  // control_addr is the underlay "host:port" address of the publisher's
  // control service; its endpoint and rendezvous ports derive from the host.
  string control_addr = 2;
  // rendezvous_addr is the underlay "host:port" address the publisher's
  // rendezvous acceptor listens on for first contact.
  string rendezvous_addr = 3;
  // private marks a node behind address translation: joinable by no one,
  // candidate for no one's redundancy floor (ADR-0008's reachability class).
  bool private = 4;
}

message PublishRequest {
  // entry is the publisher's claimed entry; the ISD-AS comes from the
  // authenticated certificate chain, the rest from the entry.
  Entry entry = 1;
}

message PublishResponse {}

message ListRequest {}

message ListResponse {
  // entries holds one entry per publishing node.
  repeated Entry entries = 1;
}

// DirectoryService distributes the node directory the selection loop draws
// its candidates from. The core stores what enrolled nodes publish over
// their authenticated channel and serves the list to everyone; entries
// expire without refresh.
service DirectoryService {
  // Publish records the caller's entry.
  rpc Publish(PublishRequest) returns (PublishResponse);
  // List returns every published entry.
  rpc List(ListRequest) returns (ListResponse);
}
