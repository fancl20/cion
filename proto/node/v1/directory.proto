syntax = "proto3";

package node.v1;

import "proto/crypto/v1/signed.proto";

option go_package = "github.com/fancl20/cion/proto/node/v1;nodev1";

// Entry is one node's statement in one of the directories it holds: the
// addresses that directory's peers reach it at, its report of how they
// reach each, the round trips it measured to them, and the cluster it
// joined. It travels as the
// body of a SCION signed message its node signed, as a beacon's AS entry
// does: the header names the signer's ISD-AS, its subject key, the TRC its
// chain verifies under, and the signing time. An entry naming no address
// withdraws its signer from the directory.
message Entry {
  // isd_as is the signer's ISD-AS; a receiver refuses an entry whose signer
  // is another.
  uint64 isd_as = 1;
  // addresses are the signer's addresses, one per host the directory's
  // peers see it at, ordered by host.
  repeated Address addresses = 2;
  // peers are the directory's peers the signer measured, ordered by ISD-AS:
  // every node of the directory it reached, linked or not.
  repeated Peer peers = 3;
  // cluster is the ISD-AS naming the cluster the signer joined, zero for
  // none.
  uint64 cluster = 4;
}

// Peer is one peer a node measured, as the node reports it: the round trip
// and its bounds, the link it holds to the peer, and the changes it
// announced there.
message Peer {
  // isd_as is the peer's ISD-AS.
  uint64 isd_as = 1;
  // rtt_us is the round trip the node measured to the peer, in
  // microseconds.
  uint32 rtt_us = 2;
  // rtt_low_us and rtt_high_us bound the node's round trips to the peer
  // over the history its decisions read, in microseconds, zero where its
  // probes give no bound.
  uint32 rtt_low_us = 7;
  uint32 rtt_high_us = 8;
  // if_id is the node's interface of its established link to the peer
  // whose verdict is up, zero for none.
  uint32 if_id = 3;
  // promoting reports that the node announced establishing a link to the
  // peer.
  bool promoting = 4;
  // retiring reports that the node announced retiring its link to the
  // peer, and relies the links the routes it judged that link by cross.
  bool retiring = 5;
  repeated LinkRef relies = 6;
}

// LinkRef names one link by one end: that end's ISD-AS and its interface
// ID.
message LinkRef {
  uint64 isd_as = 1;
  uint32 if_id = 2;
}

// Address is one host a directory's peers see a node at, and the node's
// report of how they reach it there.
message Address {
  // control_addr is the underlay "host:port" address of the node's control
  // service, the endpoint port on the host.
  string control_addr = 1;
  // rendezvous_addr is the underlay "host:port" address the node's
  // rendezvous acceptor listens on for first contact, the fixed rendezvous
  // port on the host.
  string rendezvous_addr = 2;
  // behind_nat reports that the host is not an address of the node's own:
  // a NAT stands between it and the directory's peers.
  bool behind_nat = 3;
  // rendezvous_unanswered reports that a linked peer that sees the node at
  // the host got no answer at its rendezvous address.
  bool rendezvous_unanswered = 4;
}

// Summary names a signer's greatest entry by what orders it: the TRC the
// signer named, the signing time, and a digest of the signed bytes.
message Summary {
  // isd_as is the signer's ISD-AS.
  uint64 isd_as = 1;
  // trc_base and trc_serial name the TRC the signer named.
  uint64 trc_base = 2;
  uint64 trc_serial = 3;
  // signed_at is the signing time, in nanoseconds since the Unix epoch.
  int64 signed_at = 4;
  // digest is the SHA-256 of the signed message's header_and_body.
  bytes digest = 5;
}

message PushRequest {
  // entries are the entries pushed, each a signed message whose body is an
  // Entry.
  repeated proto.crypto.v1.SignedMessage entries = 1;
}

message PushResponse {}

message SyncRequest {
  // directory is the 16-byte ID of the directory the caller's end of the
  // link joins.
  bytes directory = 1;
  // summaries names each signer's greatest entry the caller holds there.
  repeated Summary summaries = 2;
}

message SyncResponse {
  // directory is the 16-byte ID of the directory the receiver's end of the
  // link joins, once it kept the lesser of the two ends' IDs.
  bytes directory = 1;
  // entries holds the entries the caller lacks or holds a lesser one of,
  // each a signed message whose body is an Entry.
  repeated proto.crypto.v1.SignedMessage entries = 2;
  // wanted names the signers whose entries the receiver lacks or holds a
  // lesser one of; the caller pushes them.
  repeated uint64 wanted = 3;
}

// DirectoryService replicates the node's directories between linked nodes
// over the one-hop channel, both ends authenticated by their chains: each
// link joins one directory at each end, and every node holds each signer's
// greatest signed entry of each directory it holds.
service DirectoryService {
  // Push hands the receiver entries of the link's directory; it keeps the
  // greater ones and floods them on.
  rpc Push(PushRequest) returns (PushResponse);
  // Sync hands the receiver the ID and the summary of the caller's
  // directory for the link: the receiver keeps the lesser ID, answers with
  // its own and the entries the caller lacks, and names the ones it lacks
  // itself.
  rpc Sync(SyncRequest) returns (SyncResponse);
}
