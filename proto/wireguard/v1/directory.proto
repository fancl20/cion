syntax = "proto3";

package wireguard.v1;

option go_package = "github.com/fancl20/cion/proto/wireguard/v1;wireguardv1";

// Entry is one node's publication: everything another node needs to
// establish a mesh tunnel to it.
message Entry {
  // isd_as is the publisher's ISD-AS. The directory records the ISD-AS the
  // authenticated publisher's certificate names, never the claimed one.
  uint64 isd_as = 1;
  // public_key is the node's 32-byte WireGuard public key.
  bytes public_key = 2;
  // overlay_subnet is the node's overlay subnet, e.g. "10.64.1.0/24".
  string overlay_subnet = 3;
}

message PublishRequest {
  // entry is the publisher's claimed entry; the ISD-AS comes from the
  // authenticated certificate chain, the rest from the entry.
  Entry entry = 1;
}

message PublishResponse {}

message ListRequest {}

message ListResponse {
  // entries holds one entry per publishing node.
  repeated Entry entries = 1;
}

// DirectoryService distributes node entries. Any authenticated node may
// publish its own entry; every node may list the directory.
service DirectoryService {
  // Publish records the caller's entry.
  rpc Publish(PublishRequest) returns (PublishResponse);
  // List returns every published entry.
  rpc List(ListRequest) returns (ListResponse);
}
